<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mello OS — Gestão de Assistência Técnica</title>
  <link rel="icon" href="logo_mello_informatica.jpg">
  <link rel="stylesheet" href="style.css?v=20260729-4">
</head>
<body>
  <div id="loader" class="loader"><span></span><img class="loader-logo" src="logo_mello_informatica.jpg" alt="Mello Informática"></div>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand"><img class="brand-logo" src="logo_mello_informatica.jpg" alt="Mello Informática"></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot"><button class="nav-item" data-action="collapse">☰ <span>Recolher menu</span></button></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-menu" data-action="collapse" aria-label="Menu">☰</button>
        <label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Pesquisar clientes, OS ou serial…"><kbd>Ctrl F</kbd></label>
        <div class="top-actions">
          <div class="clock"><strong id="clockTime"></strong><small id="clockDate"></small></div>
          <button class="icon-btn" data-action="theme" aria-label="Alternar tema">◐</button>
          <button class="btn primary" data-action="new-order">＋ Nova ordem</button>
          <button class="avatar" data-route="configuracoes">MO</button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <nav class="mobile-bottom-nav" aria-label="Navegação principal">
    <button data-route="dashboard" aria-label="Abrir Dashboard"><span>⌂</span><small>Dashboard</small></button>
    <button data-route="ordens" aria-label="Abrir Ordens de Serviço"><span>▣</span><small>OS</small></button>
    <button data-route="orcamentos" aria-label="Abrir Orçamentos"><span>▤</span><small>Orçamentos</small></button>
  </nav>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts"></div>
  <input id="fileInput" type="file" accept=".json" hidden>
  <script src="utils.js?v=20260728-4"></script>
  <script src="supabase.js?v=20260728-3"></script>
  <script src="storage.js?v=20260728-3"></script>
  <script src="clientes.js?v=20260728-3"></script>
  <script src="ordens.js?v=20260729-4"></script>
  <script src="orcamentos.js?v=20260728-3"></script>
  <script src="orcamentos-simples.js?v=20260728-5"></script>
  <script src="relatorios.js?v=20260728-3"></script>
  <script src="backup.js?v=20260728-3"></script>
  <script src="pdf.js?v=20260728-3"></script>
  <script src="branding.js?v=20260728-3"></script>
  <script src="pdf-aprimorado.js?v=20260729-1"></script>
  <script src="app.js?v=20260728-3"></script>
  <script src="fluxo-mobile.js?v=20260729-1"></script>
</body>
</html>
